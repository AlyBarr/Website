<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Dark space background -->
  <rect width="32" height="32" rx="4" fill="#020810"/>

  <!-- Outer dashed orbit ring (matches nav brand-orbit) -->
  <circle cx="16" cy="16" r="14.2" fill="none" stroke="#3dffd0"
    stroke-width="0.55" stroke-opacity="0.30" stroke-dasharray="1.8 4.5"/>

  <!-- Inner arcs — top-right and bottom-left (matches nav) -->
  <path d="M 16 3.6 A 12.4 12.4 0 0 1 28.4 16"
    fill="none" stroke="#3dffd0" stroke-width="0.9" stroke-opacity="0.55" stroke-linecap="round"/>
  <path d="M 16 28.4 A 12.4 12.4 0 0 1 3.6 16"
    fill="none" stroke="#3dffd0" stroke-width="0.9" stroke-opacity="0.35" stroke-linecap="round"/>

  <!-- A glyph — white, angular left side (scaled from 36→32 viewBox) -->
  <path d="M 8.9 22.2 L 13.3 9.8 L 16 14.2 M 10.5 18.2 L 14.6 18.2"
    fill="none" stroke="#e6f3f8" stroke-width="1.3"
    stroke-linecap="round" stroke-linejoin="round"/>

  <!-- B glyph — teal right side (scaled from 36→32 viewBox) -->
  <path d="M 17.8 9.8 L 17.8 22.2
           M 17.8 9.8  Q 24 9.8  24 13.3 Q 24 16 17.8 16
           M 17.8 16   Q 24.4 16 24.4 19.6 Q 24.4 22.2 17.8 22.2"
    fill="none" stroke="#3dffd0" stroke-width="1.3"
    stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Centre glow dot -->
  <circle cx="16" cy="16" r="1.4" fill="#3dffd0" fill-opacity="0.80"/>
  <circle cx="16" cy="16" r="0.6" fill="#ffffff" fill-opacity="0.90"/>

  <!-- Orbiting dot at top of ring -->
  <circle cx="16" cy="1.8" r="1.0" fill="#3dffd0" fill-opacity="0.90"/>
</svg>
